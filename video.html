const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const espera = ms => new Promise(r => setTimeout(r, ms));
const barreja = a => a.slice().sort(() => Math.random() - .5), tria = a => a[Math.floor(Math.random() * a.length)];
const sense = w => w.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
let actx; function so(tipus){ try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.connect(g); g.connect(actx.destination);
  const cfg = { tic:[900,900,.04,'sine'], ok:[660,1320,.25,'square'], no:[220,110,.35,'square'], pop:[500,800,.1,'triangle'] }[tipus]; o.type = cfg[3]; const t = actx.currentTime;
  o.frequency.setValueAtTime(cfg[0], t); o.frequency.exponentialRampToValueAtTime(cfg[1], t + cfg[2]); g.gain.setValueAtTime(.09, t); g.gain.exponentialRampToValueAtTime(.001, t + cfg[2]); o.start(t); o.stop(t + cfg[2]); } catch (e) {} }

// ---- Generadors de preguntes: { titol, mostra:[{txt, lletra?}], resposta:[{txt, ok}] } ----
const GEN = {
  catala: () => { const p = tria(DADES.cast); return { titol: 'Com diries en català?', mostra: [{ txt: cap(p[0]), x: true }], resposta: [{ txt: cap(p[1]), ok: true }] }; },
  accents: () => { const w = tria(DADES.accents), base = sense(w), VOC = { a:'aà', e:'eèé', i:'ií', o:'oòó', u:'uú' }, vs = new Set([base]);
    for (let i = 0; i < base.length; i++) for (const a of (VOC[base[i]] || '')) vs.add(base.slice(0, i) + a + base.slice(i + 1)); vs.delete(w);
    const ops = barreja([w, ...barreja([...vs]).slice(0, 2)]); return { titol: "Com s'escriu?", opcions: ops.map((o, i) => ({ txt: o, lletra: 'ABC'[i], ok: o === w })) }; },
  intrus: () => { const noms = Object.keys(DADES.cats), a = tria(noms); let b; do { b = tria(noms); } while (b === a);
    const bons = barreja(DADES.cats[a].filter(w => w.length <= 11)).slice(0, 3), dolent = tria(DADES.cats[b].filter(w => w.length <= 11));
    const ops = barreja([...bons.map(w => ({ txt: cap(w.toLowerCase()), ok: false })), { txt: cap(dolent.toLowerCase()), ok: true }]);
    return { titol: "Quin és l'intrús?", opcions: ops.map((o, i) => ({ ...o, lletra: 'ABCD'[i] })), pista: `Tres són: ${a}` }; },
  perdudes: () => { const noms = Object.keys(DADES.cats), c = tria(noms), w = tria(DADES.cats[c].filter(x => x.length >= 5 && x.length <= 10));
    const idx = barreja([...Array(w.length).keys()]).slice(0, Math.round(w.length * .45)); const forat = [...w].map((ch, i) => idx.includes(i) ? '_' : ch).join(' ');
    return { titol: 'Quina paraula és?', mostra: [{ txt: forat, x: false }], resposta: [{ txt: w, ok: true }], pista: `Categoria: ${c}` }; },
};
const CARTES = {
  intro: ['SI NO ENCERTES<br>JA POTS TORNAR<br>A SECUNDÀRIA', 'NOMÉS UN 5%<br>LES ENCERTA TOTES', 'ATREVEIX-TE!<br>10 PREGUNTES,<br>7 SEGONS', 'ETS MÉS CATALÀ<br>QUE UN CALÇOT?'],
  mig: ["DÓNA-LI AL M'AGRADA<br>SI HAS ENCERTAT<br>LES 3 PRIMERES", 'COMENTA<br>QUANTES EN PORTES'],
  final: ["PREPARA'T PER A LA<br>DARRERA PREGUNTA", 'SEGUEIX-NOS', 'COMENTA QUANTES<br>PARAULES HAS<br>ENCERTAT'],
};
function pill(o, cls = ''){ const d = document.createElement('div'); d.className = 'pill pop ' + cls; d.innerHTML = (o.lletra ? `<span class="lletra">${o.lletra}</span>` : '') + o.txt; return d; }
function badge(el, tipus){ const b = document.createElement('div'); b.className = 'badge ' + tipus; b.textContent = tipus === 'x' ? '✕' : '✓'; el.appendChild(b); }
async function carta(html, ms, cors){
  const c = $('card'); c.hidden = false; c.innerHTML = `<div class="hex" style="left:-10%;top:5%"></div><div class="hex" style="right:-15%;bottom:0;animation-delay:2s"></div><div class="t">${html}</div>`;
  if (cors) for (let i = 0; i < 14; i++) { const h = document.createElement('div'); h.className = 'cor'; h.textContent = tria(['❤️','💗','💖']); h.style.left = (5 + Math.random()*90) + '%'; h.style.animationDelay = (Math.random()*2) + 's'; c.appendChild(h); }
  so('pop'); await espera(ms); c.hidden = true;
}
async function pregunta(p, i, n, seg){
  const zona = $('zona'), bar = $('bar'); zona.innerHTML = ''; $('pregunta').textContent = p.titol; $('num').textContent = `${i}/${n}`;
  bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)';
  if (p.opcions) { $('barra').style.top = 'auto'; $('barra').style.bottom = '22%'; $('num').style.top = 'auto'; $('num').style.bottom = '16%'; }
  else { $('barra').style.top = '47%'; $('barra').style.bottom = 'auto'; $('num').style.top = '53%'; $('num').style.bottom = 'auto'; }
  // pastilla buida i pista
  if (p.opcions) for (const o of p.opcions) zona.appendChild(pill({ txt: '', lletra: o.lletra }, 'buida')); else zona.appendChild(pill({ txt: '' }, 'buida'));
  await espera(700);
  zona.innerHTML = '';
  if (p.opcions) { p.opcions.forEach(o => zona.appendChild(pill(o))); if (p.pista) { const s = document.createElement('div'); s.className = 't'; s.style.fontSize = 'min(2.6vh,4vw)'; s.textContent = p.pista; zona.appendChild(s); } }
  else { const d = pill(p.mostra[0]); if (p.mostra[0].x) badge(d, 'x'); zona.appendChild(d); if (p.pista) { const s = document.createElement('div'); s.className = 't'; s.style.fontSize = 'min(2.6vh,4vw)'; s.textContent = p.pista; zona.appendChild(s); } }
  so('pop'); void bar.offsetWidth; bar.style.transition = `transform ${seg}s linear`; bar.style.transform = 'scaleX(0)';
  for (let s = 0; s < seg; s++) { await espera(1000); if (s >= seg - 3) so('tic'); }
  // revelació
  if (p.opcions) { [...zona.querySelectorAll('.pill')].forEach((d, k) => { if (p.opcions[k].ok) { d.classList.add('ok'); badge(d, 'v'); } else d.classList.add('no'); }); so('ok'); await espera(2600); }
  else { zona.innerHTML = ''; zona.appendChild(pill({ txt: '' }, 'buida')); await espera(600); zona.innerHTML = ''; const d = pill(p.resposta[0]); badge(d, 'v'); zona.appendChild(d); so('ok'); await espera(2600); }
}
async function video(mode, n, seg, pal){
  const p = pal === 4 || isNaN(pal) ? tria(PAL) : PAL[pal];
  document.documentElement.style.setProperty('--a', p[0]); document.documentElement.style.setProperty('--b', p[1]); document.documentElement.style.setProperty('--c', p[2]);
  const usades = new Set(), preguntes = []; let guard = 0;
  while (preguntes.length < n && guard++ < 200) { const pr = GEN[mode](); const clau = JSON.stringify(pr); if (!usades.has(clau)) { usades.add(clau); preguntes.push(pr); } }
  await carta(tria(CARTES.intro), 3000);
  for (let i = 0; i < preguntes.length; i++) {
    if (i === 3) await carta(CARTES.mig[0], 3000, true);
    if (i === Math.floor(n / 2) + 1 && n >= 8) await carta(CARTES.mig[1], 2600);
    if (i === preguntes.length - 1) { for (const c of CARTES.final) await carta(c, 2200); }
    await pregunta(preguntes[i], i + 1, n, seg);
  }
  $('zona').innerHTML = ''; $('pregunta').textContent = ''; $('num').textContent = '';
  await carta('QUANTES N\'HAS<br>ENCERTAT?<br><span style="font-size:.6em">Comenta-ho 👇</span>', 4000, true);
  $('menu').hidden = false;
}
$('go').onclick = () => { $('menu').hidden = true; $('logo').textContent = $('logotxt').value; video($('mode').value, Number($('n').value), Number($('seg').value), Number($('pal').value)); };
if (q.get('mode')) { $('mode').value = q.get('mode'); if (q.get('n')) $('n').value = q.get('n'); if (q.get('seg')) $('seg').value = q.get('seg'); if (q.get('pal')) $('pal').value = q.get('pal'); if (q.get('logo')) $('logotxt').value = q.get('logo'); }
if (q.has('auto')) $('go').click();
</script>
